  - registry_name: chat-composer
    title: Chat
    source_type: registry:component
    scope_kind: composite_component
    phase: P2
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Composer respects SafeArea, software keyboard, and scroll-to-latest behavior.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/chat.dart
      - packages/beautiful_ai_ui/lib/src/implementation/controls/text_selection.dart
      - packages/beautiful_ai_ui/test/widget/chat_test.dart
      - packages/beautiful_ai_ui/test/semantics/chat_semantics_test.dart
      - packages/beautiful_ai_ui/test/golden/p2_components_golden_test.dart
      - packages/beautiful_ai_ui_catalog/lib/p2_examples.dart
    intentional_deviations:
      - The host owns messages, response identity, context selection, and errors; no scripted replies or backend are included.
      - Local draft, focus, and reading position survive snapshot and viewport changes; new conversation identity resets the draft and isolates old callbacks.
      - Enter sends while Shift+Enter and software newline preserve multiline input; active IME composition never submits.
      - Send and stop de-duplicate pending actions; send success clears only the unchanged submitted draft.
      - New messages follow the bottom only when the reader was already there; otherwise an explicit latest action is available.
      - Message bodies are readable without live token announcements; response and error status are announced separately.
    accepted_evidence:
