    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite_and_vertical_slice
    adaptive_note: Preserve status and elapsed information; reduce non-essential motion.
    asset_note: The Surfer remote video is excluded.
    variants:
      - drive
      - dots
      - orbit
      - surfer
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/loading_state.dart
      - packages/beautiful_ai_ui/test/widget/loading_state_test.dart
      - packages/beautiful_ai_ui/test/semantics
      - packages/beautiful_ai_ui/test/golden
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Elapsed time is caller-controlled instead of an internal demo timer.
      - The Surfer variant has no default network request or third-party game video.
      - Reduced motion freezes repeating pixels, shimmer, and the code-rendered media fallback; caller media state is preserved under TickerMode.
      - Elapsed time is a separate non-live semantics node so decisecond changes cannot create announcement storms.
      - Label and elapsed text use the stronger muted-ink token instead of source ink-3 so small text can meet contrast guidance.
    accepted_evidence:
