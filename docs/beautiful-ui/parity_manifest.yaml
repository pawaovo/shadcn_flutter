  - registry_name: code-block
    title: Code Block
    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Code scrolls horizontally and copy feedback is announced.
    variants:
      - code
      - diff
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/code_block.dart
      - packages/beautiful_ai_ui/test/widget/code_block_test.dart
      - packages/beautiful_ai_ui/test/semantics/code_block_semantics_test.dart
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Named constructors and one canonical code string replace string variants and divergent display/copy values.
      - Long code remains unwrapped in a horizontal viewport rather than using the source pre-wrap behavior.
      - Copy is de-duplicated while pending and exposes localized success or failure live feedback.
      - Diff rows announce added, removed, or context meaning instead of relying on color.
      - Copy and header targets are enlarged from the source visual size to Flutter accessibility guidance.
    open_items:
      - real assistive-technology smoke evidence
      - explicit high-contrast behavior evidence
      - long-source tokenization and intrinsic-layout benchmark before a stable release

