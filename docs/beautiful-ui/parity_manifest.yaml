phase_meanings:
  P0: Foundation, package seam, shared policy, catalog, and test infrastructure.
  P1: Six-component MVP after the Loading State vertical slice.
  P2: Agent workflow components and the building blocks first required by them.
  P3: Complex data, navigation, composition, visualization, and selection experiences.

status_meanings:
  not_started: No implementation evidence has been accepted.
  in_progress: Implementation exists but one or more definition-of-done dimensions are incomplete.
  blocked: A recorded product, platform, dependency, or licensing decision prevents progress.
  complete: All applicable definition-of-done dimensions and release evidence are accepted.
  mapped_to_dependency: The source item is intentionally satisfied by an existing dependency and verified through the consuming composites.
  excluded: The source item is deliberately outside distributable scope, with a recorded reason.

definition_of_done:
  - public_api_boundary
  - visual_states
  - core_interactions
  - compact_medium_expanded
  - state_preservation_on_resize
  - touch_pointer_keyboard
  - semantics_and_assistive_technology
  - light_dark_high_contrast
  - text_scale_localization_rtl
  - reduced_motion
  - unit_widget_semantics_golden_tests
  - catalog_scenarios
  - documentation
  - source_license_and_asset_provenance
  - required_platform_evidence

release_open_items:
  - Resolve the iOS simulator app-launch timeout and verify the next committed tree, including strict comparison against accepted Linux baselines and dependent publish validation.
  - Complete physical-device and real TalkBack, VoiceOver, Narrator, and Orca task workflows.
  - After manual Mac unlock, finish the post-TickerMode Safari visual recheck; remaining browser, localization, visual-state and temporal motion combinations stay open.
  - Final profile run 4 has not started because Computer Use requires manual unlock of the local Mac; agreed budgets, repeatability and representative other-platform or physical-device measurements remain open.

