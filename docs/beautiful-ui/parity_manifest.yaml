phase_meanings:
  P0: Foundation, package seam, shared policy, catalog, and test infrastructure.
  P1: Six-component MVP after the Loading State vertical slice.
  P2: Agent workflow components and the building blocks first required by them.
  P3: Complex data, navigation, composition, visualization, and selection experiences.

status_meanings:
  not_started: No implementation evidence has been accepted.
  in_progress: Implementation exists but one or more definition-of-done dimensions are incomplete.
  blocked: A recorded product, platform, dependency, or licensing decision prevents progress.
  complete: All applicable definition-of-done dimensions and release evidence are accepted.
  mapped_to_dependency: The source item is intentionally satisfied by an existing dependency and verified through the consuming composites.
  excluded: The source item is deliberately outside distributable scope, with a recorded reason.

definition_of_done:
  - public_api_boundary
