  - registry_name: search
    title: Search
    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: The public module is inline and responsive; host overlays choose dialog, popover, or compact sheet presentation.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/search.dart
      - packages/beautiful_ai_ui/test/widget/search_test.dart
      - packages/beautiful_ai_ui/test/semantics/search_semantics_test.dart
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Stable typed items replace bare strings and preserve identity across filtering and resize.
      - Arrow navigation, Enter selection, Escape clearing, selected Semantics, and IME composition protection are implemented inside the module.
