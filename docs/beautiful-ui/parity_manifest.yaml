  - registry_name: loading-state
    title: Loading State
    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite_and_vertical_slice
    adaptive_note: Preserve status and elapsed information; reduce non-essential motion.
    asset_note: The Surfer remote video is excluded.
    variants:
      - drive
      - dots
      - orbit
      - surfer
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/loading_state.dart
      - packages/beautiful_ai_ui/test/widget/loading_state_test.dart
      - packages/beautiful_ai_ui/test/semantics
      - packages/beautiful_ai_ui/test/golden
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Elapsed time is caller-controlled instead of an internal demo timer.
      - The Surfer variant has no default network request or third-party game video.
      - Reduced motion freezes repeating pixels, shimmer, and the code-rendered media fallback; caller media state is preserved under TickerMode.
      - Elapsed time is a separate non-live semantics node so decisecond changes cannot create announcement storms.
      - Label and elapsed text use the stronger muted-ink token instead of source ink-3 so small text can meet contrast guidance.
    open_items:
      - real assistive-technology smoke evidence

  - registry_name: thinking-state
    title: Thinking
    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Disclosure state survives constraint changes.
    variants:
      - steps
      - reasoning
      - search
      - coding
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/thinking.dart
      - packages/beautiful_ai_ui/test/widget/thinking_test.dart
      - packages/beautiful_ai_ui/test/semantics/thinking_semantics_test.dart
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Status and immutable trace snapshots are caller-controlled; the package contains no demo sequence timer.
      - Collapsed interactive descendants are removed from focus and Semantics traversal.
      - Search and coding activation are delegated to the host and never open URLs or run tools internally.
      - Compact and large-text layouts may wrap source content that the Web reference truncates.
      - Reduced motion removes continuous shimmer and spinner motion without changing caller state.
      - Disclosure actions use independent localizable labels so the status and button are not announced twice.
    open_items:
      - real assistive-technology smoke evidence
      - explicit high-contrast behavior evidence

  - registry_name: streaming-text
    title: Streaming Text
    source_type: registry:component
    scope_kind: composite_component
    phase: P2
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Selectable content grows naturally; sources and actions wrap or use a sheet.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/streaming_text.dart
      - packages/beautiful_ai_ui/lib/src/implementation/streaming/stream_content.dart
      - packages/beautiful_ai_ui/test/widget/streaming_text_test.dart
      - packages/beautiful_ai_ui/test/semantics/streaming_text_semantics_test.dart
      - packages/beautiful_ai_ui/test/golden/p2_components_golden_test.dart
      - packages/beautiful_ai_ui_catalog/lib/p2_examples.dart
    intentional_deviations:
      - Exact Unicode text parts, lifecycle, feedback, and stable source IDs are caller-owned; no simulated token timer or network transport is bundled.
      - Inline citations describe their source; expanded sources provide full-size touch and keyboard actions instead of tiny embedded links.
      - Source artwork and demo URLs are omitted; host callbacks own source navigation, follow-ups, feedback, and retry.
      - Clipboard and retry requests de-duplicate pending work and ignore obsolete completions after their generation or copy snapshot changes.
      - Native live regions announce localized lifecycle and copy status without announcing every text chunk.
    open_items:
      - accepted P2 canonical golden and required remote platform evidence
      - real assistive-technology and physical-device text-selection evidence
      - long-answer streaming and selection performance evidence

  - registry_name: approval-card
    title: Approval Card
    source_type: registry:component
    scope_kind: composite_component
    phase: P2
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Primary actions remain reachable above the software keyboard.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/approval_card.dart
      - packages/beautiful_ai_ui/lib/src/implementation/controls/text_selection.dart
      - packages/beautiful_ai_ui/test/widget/approval_card_test.dart
      - packages/beautiful_ai_ui/test/semantics/approval_card_semantics_test.dart
      - packages/beautiful_ai_ui/test/golden/p2_components_golden_test.dart
      - packages/beautiful_ai_ui_catalog/lib/p2_examples.dart
    intentional_deviations:
      - Stable question and option IDs preserve local drafts through reordering and discard removed choices.
      - Single-choice auto-advance is explicit and configurable; multiple-choice and custom answers require Continue or Send.
      - Submission passes immutable answers to an asynchronous host callback, de-duplicates pending requests, and ignores stale model completions.
      - Success follows a completed host callback; failures preserve editable drafts and report through the root failure seam.
      - Keyboard navigation, IME-safe custom entry, and scrollable keyboard-constrained layouts replace source browser-specific behavior.
    open_items:
      - accepted P2 canonical golden and required remote platform evidence
      - real assistive-technology and physical-device keyboard evidence
      - final normal and reduced-motion transition review

