  - registry_name: filter-table
    title: Filter Table
    source_type: registry:component
    scope_kind: composite_component
    phase: P2
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Compact and medium modes use wrapping cards; expanded mode uses four aligned columns.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/filter_table.dart
      - packages/beautiful_ai_ui/test/widget/filter_table_test.dart
      - packages/beautiful_ai_ui/test/semantics/filter_table_semantics_test.dart
      - packages/beautiful_ai_ui/test/golden/p2_components_golden_test.dart
      - packages/beautiful_ai_ui_catalog/lib/p2_examples.dart
    intentional_deviations:
      - Counts derive from immutable caller rows and local status selection; initialStatus is read once and onFilterChanged only reports user changes.
      - Hidden rows leave visible and Semantics trees immediately; matching counts use a native live-region label.
      - Expanded tables expose table, header, row, and cell semantics while smaller layouts preserve every field in list items.
      - The host supplies scrolling for long result sets; the component does not fetch, edit, sort, or virtualize business records.
    open_items:
      - accepted P2 canonical golden and required remote platform evidence
      - real assistive-technology table and list navigation evidence
      - documented practical row-count and layout performance evidence

