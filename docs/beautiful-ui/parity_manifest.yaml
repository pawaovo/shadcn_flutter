  - registry_name: fine-tune-card
    title: Fine-tune Card
    source_type: registry:component
    scope_kind: composite_component
    phase: P2
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Compact stacks fields; numeric controls support touch, keyboard, and direct input.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/fine_tune_card.dart
      - packages/beautiful_ai_ui/test/widget/fine_tune_card_test.dart
      - packages/beautiful_ai_ui/test/semantics/fine_tune_card_semantics_test.dart
      - packages/beautiful_ai_ui/test/golden/p2_components_golden_test.dart
      - packages/beautiful_ai_ui_catalog/lib/p2_examples.dart
    intentional_deviations:
      - The host owns accepted settings; every edit emits a complete proposed snapshot instead of silently accepting it locally.
      - Stable field IDs and finite bounds are validated, including release builds; fractional steps are retained rather than rounded to integers.
      - Numeric drafts preserve invalid and composing input, commit on Enter, Done, or blur, and restore the accepted value on Escape.
      - Numeric adjustment supports 48dp buttons, arrow keys, Shift acceleration, horizontal pointer scrubbing, and assistive increase and decrease actions.
      - Type choices open inline and restore focus on dismissal; the Edited marker compares accepted values with the initial mounted snapshot.
    open_items:
      - accepted P2 canonical golden and required remote platform evidence
      - real assistive-technology and physical-device numeric input evidence

