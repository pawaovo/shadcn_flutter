  - registry_name: recommendation-card
    title: Recommendation Card
    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Primary action becomes full width and confidence includes text.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/recommendation_card.dart
      - packages/beautiful_ai_ui/test/widget/recommendation_card_test.dart
      - packages/beautiful_ai_ui/test/semantics/recommendation_card_semantics_test.dart
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Recommendation content is structured text instead of an arbitrary Widget or ReactNode slot.
      - Acceptance is an asynchronous host callback with pending de-duplication and normalized failure reporting.
      - A model generation prevents stale success or failure from committing after the recommendation snapshot changes.
      - Collapsed alternatives leave focus and Semantics traversal.
      - Compact and large-text layouts stack actions and make the primary action full width.
    open_items:
      - real assistive-technology smoke evidence
      - explicit normal and reduced-motion acceptance-transition evidence

  - registry_name: context-cards
    title: Context Cards
    source_type: registry:component
    scope_kind: composite_component
    phase: P1
    status: in_progress
    planned_disposition: public_composite
    adaptive_note: Compact uses a single column with expandable long content.
    implementation_paths:
      - packages/beautiful_ai_ui/lib/src/components/context_cards.dart
      - packages/beautiful_ai_ui/test/widget/context_cards_test.dart
      - packages/beautiful_ai_ui/test/semantics/context_cards_semantics_test.dart
      - packages/beautiful_ai_ui_catalog/lib/main.dart
    intentional_deviations:
      - Stable caller-owned IDs replace title-based reconciliation.
      - Long compact content has an accessible local disclosure.
      - Collapsed body Semantics expose a shortened summary; the full body is restored only after expansion.
      - A source becomes interactive only when the host supplies a callback; the package never launches a URL.
      - Platform targets are enlarged to Android and Apple accessibility guidance.
      - The caller list is defensively snapshotted on insertion and widget updates.
    open_items:
      - real assistive-technology smoke evidence
      - explicit high-contrast behavior evidence

