name: Beautiful AI UI

on:
  pull_request:
    branches:
      - product/main
  push:
    branches:
      - product/main
  workflow_dispatch:

concurrency:
  group: beautiful-ai-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  LIBRARY_DIR: packages/beautiful_ai_ui
  CATALOG_DIR: packages/beautiful_ai_ui_catalog

jobs:
  detect-targets:
    name: Detect generated targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      library: ${{ steps.paths.outputs.library }}
      catalog: ${{ steps.paths.outputs.catalog }}
      web: ${{ steps.paths.outputs.web }}
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}
      macos: ${{ steps.paths.outputs.macos }}
      windows: ${{ steps.paths.outputs.windows }}
      linux: ${{ steps.paths.outputs.linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect packages and generated platform runners
        id: paths
        shell: bash
        run: |
          {
            echo "library=$([ -f "$LIBRARY_DIR/pubspec.yaml" ] && echo true || echo false)"
            echo "catalog=$([ -f "$CATALOG_DIR/pubspec.yaml" ] && echo true || echo false)"
            echo "web=$([ -d "$CATALOG_DIR/web" ] && echo true || echo false)"
            echo "android=$([ -d "$CATALOG_DIR/android" ] && echo true || echo false)"
            echo "ios=$([ -d "$CATALOG_DIR/ios" ] && echo true || echo false)"
            echo "macos=$([ -d "$CATALOG_DIR/macos" ] && echo true || echo false)"
            echo "windows=$([ -d "$CATALOG_DIR/windows" ] && echo true || echo false)"
            echo "linux=$([ -d "$CATALOG_DIR/linux" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          for platform in web android ios macos windows linux; do
            if [ ! -d "$CATALOG_DIR/$platform" ]; then
              echo "::error::Required $platform catalog runner is missing."
              exit 1
            fi
          done

          if [ ! -f "$LIBRARY_DIR/pubspec.yaml" ] || [ ! -f "$CATALOG_DIR/pubspec.yaml" ]; then
            echo "::error::Required Beautiful AI UI library or catalog package is missing."
            exit 1
          fi

          for journey_file in \
            "$CATALOG_DIR/integration_test/catalog_journey_test.dart" \
            "$CATALOG_DIR/test_driver/integration_test.dart"; do
            if [ ! -f "$journey_file" ]; then
              echo "::error::Required catalog journey file is missing: $journey_file"
              exit 1
            fi
          done

  quality:
    name: Format, analyze, and test
    needs: detect-targets
    if: needs.detect-targets.outputs.library == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report Flutter version
        run: flutter --version

      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify asset provenance, notices, and original artwork
        shell: bash
        run: |
          mkdir -p artifacts/asset-audits
          python3 tool/audit_dependency_assets.py --require-complete-provenance \
            --json-output artifacts/asset-audits/source-dependency-assets.json > /dev/null
          python3 tool/audit_transitive_media.py > artifacts/asset-audits/source-media.json
          python3 packages/beautiful_ai_ui_catalog/tool/generate_catalog_icons.py --check

      - name: Verify pub workspace
        run: dart pub workspace list

      - name: Check formatting
        shell: bash
        run: |
          targets=(
            "$LIBRARY_DIR"
            "packages/shadcn_flutter/lib/src/shadcn_app.dart"
            "packages/shadcn_flutter/test/components/shadcn_layer_test.dart"
          )
          if [ -d "$CATALOG_DIR" ]; then
            targets+=("$CATALOG_DIR")
          fi
          dart format --output=none --set-exit-if-changed "${targets[@]}"

      - name: Analyze packages
        shell: bash
        run: |
          packages=("packages/shadcn_flutter" "$LIBRARY_DIR")
          if [ -f "$CATALOG_DIR/pubspec.yaml" ]; then
            packages+=("$CATALOG_DIR")
          fi

          for package in "${packages[@]}"; do
            (cd "$package" && flutter analyze --fatal-infos --fatal-warnings)
          done

      - name: Enforce the shadcn implementation seam
        shell: bash
        run: |
          if rg -n "package:shadcn_flutter/src/" "$LIBRARY_DIR/lib"; then
            echo "::error::beautiful_ai_ui must not deep-import shadcn_flutter src libraries."
            exit 1
          fi

          if rg -n "package:shadcn_flutter" "$LIBRARY_DIR/lib" \
            --glob '!**/implementation/shadcn/**'; then
            echo "::error::Only the internal implementation/shadcn seam may import shadcn_flutter."
            exit 1
          fi

          if rg -n "export .*shadcn_flutter" "$LIBRARY_DIR/lib"; then
            echo "::error::The public package must not re-export shadcn_flutter."
            exit 1
          fi

      - name: Run package tests
        working-directory: packages/beautiful_ai_ui
        shell: bash
        run: |
          mapfile -d '' tests < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/semantics/*' \
              ! -path 'test/golden/*' \
              -print0 2>/dev/null
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::Required package behavior tests are missing."
            exit 1
          fi
          flutter test --no-pub "${tests[@]}"

      - name: Run semantics tests
        working-directory: packages/beautiful_ai_ui
        shell: bash
        run: |
          if find test/semantics -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub test/semantics
          else
            echo "::error::Required semantics tests are missing."
            exit 1
          fi

      - name: Verify Linux golden tests
        working-directory: packages/beautiful_ai_ui
        shell: bash
        run: |
          if find test/golden -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub --concurrency=1 test/golden
          else
            echo "::error::Required golden tests are missing."
            exit 1
          fi

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-golden-failures
          path: packages/beautiful_ai_ui/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run catalog tests
        if: needs.detect-targets.outputs.catalog == 'true'
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub
          else
            echo "::error::Required catalog tests are missing."
            exit 1
          fi

      - name: Run shadcn core regression tests
        working-directory: packages/shadcn_flutter
        run: flutter test --no-pub

      - name: Upload source asset audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-asset-audits
          path: artifacts/asset-audits/
          if-no-files-found: warn
          retention-days: 7

  web-build:
    name: Build Web catalog
    needs: detect-targets
    if: needs.detect-targets.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Build Web release
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build web --release --no-pub --dart-define=ENABLE_WEB_SEMANTICS=true

      - name: Verify JavaScript bundle assets and notices
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          mkdir -p artifacts/asset-audits
          python3 ../../tool/audit_dependency_assets.py --bundle build/web/assets \
            --require-complete-provenance \
            --json-output artifacts/asset-audits/web-js-dependency-assets.json > /dev/null
          python3 ../../tool/audit_transitive_media.py --bundle build/web \
            > artifacts/asset-audits/web-js-media.json

      - name: Build WebAssembly release
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build web --release --wasm --no-pub --dart-define=ENABLE_WEB_SEMANTICS=true

      - name: Verify WebAssembly bundle assets and notices
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          python3 ../../tool/audit_dependency_assets.py --bundle build/web/assets \
            --require-complete-provenance \
            --json-output artifacts/asset-audits/web-wasm-dependency-assets.json > /dev/null
          python3 ../../tool/audit_transitive_media.py --bundle build/web \
            > artifacts/asset-audits/web-wasm-media.json

      - name: Upload Web asset audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-asset-audits
          path: packages/beautiful_ai_ui_catalog/artifacts/asset-audits/
          if-no-files-found: warn
          retention-days: 7

  android-build:
    name: Build Android catalog
    needs: detect-targets
    if: needs.detect-targets.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Build Android debug APK
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build apk --debug --no-pub

  web-linux-journeys:
    name: Run Chrome and Linux journeys
    needs: detect-targets
    if: needs.detect-targets.outputs.web == 'true' && needs.detect-targets.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux journey dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libgtk-3-dev liblzma-dev libstdc++-12-dev ninja-build pkg-config xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Run Chrome journey
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          export PATH="$CHROMEWEBDRIVER:$PATH"
          mkdir -p artifacts/chrome
          export BEAUTIFUL_INPUT_EVIDENCE="$PWD/artifacts/chrome"
          chromedriver --port=4444 > artifacts/chrome/chromedriver.log 2>&1 &
          webdriver_pid=$!
          trap 'kill "$webdriver_pid" 2>/dev/null || true' EXIT
          flutter drive \
            --driver=integration_test/driver/catalog_trusted_journey_driver.dart \
            --target=integration_test/catalog_journey_test.dart \
            --dart-define=CATALOG_TRUSTED_BROWSER_COPY=true \
            --device-id=web-server \
            --browser-name=chrome \
            --driver-port=4444 \
            --browser-dimension=1440x900 \
            --web-browser-flag=--force-device-scale-factor=1 \
            --no-pub

      - name: Run Linux desktop journey
        working-directory: packages/beautiful_ai_ui_catalog
        run: xvfb-run --auto-servernum flutter test integration_test/catalog_journey_test.dart --device-id=linux --no-pub

      - name: Upload trusted Chrome journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-trusted-journey
          path: packages/beautiful_ai_ui_catalog/artifacts/chrome/
          if-no-files-found: warn

  firefox-journey:
    name: Run Firefox journey
    needs: detect-targets
    if: needs.detect-targets.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Run shared journey in installed Firefox
        timeout-minutes: 20
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/firefox
          export BEAUTIFUL_INPUT_EVIDENCE="$PWD/artifacts/firefox"
          firefox --version | tee artifacts/firefox/browser-version.txt
          "$GECKOWEBDRIVER/geckodriver" --version | tee artifacts/firefox/driver-version.txt
          "$GECKOWEBDRIVER/geckodriver" --host 127.0.0.1 --port 4444 \
            > artifacts/firefox/geckodriver.log 2>&1 &
          webdriver_pid=$!
          cleanup() {
            if kill -0 "$webdriver_pid" 2>/dev/null; then
              kill "$webdriver_pid"
              for attempt in {1..25}; do
                if ! kill -0 "$webdriver_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.2
              done
              if kill -0 "$webdriver_pid" 2>/dev/null; then
                kill -KILL "$webdriver_pid"
              fi
              wait "$webdriver_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$webdriver_pid" 2>/dev/null; then
              cat artifacts/firefox/geckodriver.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:4444/status \
              | jq --exit-status '.value.ready == true' > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo '::error::Firefox WebDriver did not become ready.'
            exit 1
          fi
          flutter drive \
            --driver=integration_test/driver/catalog_trusted_journey_driver.dart \
            --target=integration_test/catalog_journey_test.dart \
            --dart-define=CATALOG_TRUSTED_BROWSER_COPY=true \
            --device-id=web-server --browser-name=firefox --headless \
            --driver-port=4444 --browser-dimension=1440x900 \
            --no-pub 2>&1 | tee artifacts/firefox/journey.log

      - name: Upload Firefox journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-journey
          path: packages/beautiful_ai_ui_catalog/artifacts/firefox/
          if-no-files-found: warn
          retention-days: 7

  edge-journey:
    name: Run Edge journey
    needs: detect-targets
    if: needs.detect-targets.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the narrow Edge protocol adapter
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_flutter_edge_webdriver.py'
          python3 -B -m unittest discover -s .github/scripts -p 'test_edge_resource_observation.py'
          python3 -B -m unittest discover -s .github/scripts -p 'test_prepare_edge_ci.py'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Record one bounded Edge ELF preread as CI setup
        timeout-minutes: 2
        run: >-
          python3 -B .github/scripts/prepare_edge_ci.py preread
          --executable /opt/microsoft/msedge/msedge --timeout 60
          --output packages/beautiful_ai_ui_catalog/artifacts/edge/startup-condition

      - name: Run shared journey in installed Microsoft Edge
        id: edge_journey
        timeout-minutes: 20
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/edge
          export BEAUTIFUL_INPUT_EVIDENCE="$PWD/artifacts/edge"
          python3 ../../.github/scripts/flutter_edge_webdriver.py \
            --driver "$EDGEWEBDRIVER/msedgedriver" \
            --binary "$(command -v microsoft-edge)" \
            --log artifacts/edge/msedgedriver.log \
            --evidence artifacts/edge/browser-identity.json \
            --diagnostics artifacts/edge/diagnostics \
            --resources artifacts/edge/resources \
            > artifacts/edge/adapter.log 2>&1 &
          adapter_pid=$!
          cleanup() {
            if kill -0 "$adapter_pid" 2>/dev/null; then
              kill "$adapter_pid"
              for attempt in {1..60}; do
                if ! kill -0 "$adapter_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.2
              done
              if kill -0 "$adapter_pid" 2>/dev/null; then
                kill -KILL "$adapter_pid"
              fi
              wait "$adapter_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$adapter_pid" 2>/dev/null; then
              cat artifacts/edge/adapter.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:4444/status \
              | jq --exit-status '.value.ready == true' > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo '::error::Microsoft Edge WebDriver did not become ready.'
            exit 1
          fi
          flutter drive \
            --driver=integration_test/driver/catalog_trusted_journey_driver.dart \
            --target=integration_test/catalog_journey_test.dart \
            --dart-define=CATALOG_TRUSTED_BROWSER_COPY=true \
            --device-id=web-server --browser-name=edge \
            --driver-port=4444 --browser-dimension=1440x900 \
            --no-pub 2>&1 | tee artifacts/edge/journey.log
          test -s artifacts/edge/browser-identity.json

      - name: Bind preread to actual Edge session after observed processes stop
        if: always()
        timeout-minutes: 2
        run: >-
          python3 -B .github/scripts/prepare_edge_ci.py verify
          --output packages/beautiful_ai_ui_catalog/artifacts/edge/startup-condition
          --suite packages/beautiful_ai_ui_catalog/artifacts/edge
          --run-outcome '${{ steps.edge_journey.outcome }}'

      - name: Upload Edge journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-journey
          path: packages/beautiful_ai_ui_catalog/artifacts/edge/
          if-no-files-found: warn
          retention-days: 7

  android-journey:
    name: Run Android journey
    needs: detect-targets
    if: needs.detect-targets.outputs.android == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies with bounded retry
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter pub get --enforce-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run journey on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd packages/beautiful_ai_ui_catalog && flutter test integration_test/catalog_journey_test.dart --device-id=emulator-5554 --no-pub

  apple-builds:
    name: Build Apple catalogs
    needs: detect-targets
    if: (needs.detect-targets.outputs.ios == 'true' || needs.detect-targets.outputs.macos == 'true') && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the bounded simulator console launcher
        if: needs.detect-targets.outputs.ios == 'true'
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_run_ios_catalog_journey.py'

      - name: Select full Xcode before dependency resolution
        run: |
          test -d /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Build iOS release without code signing
        if: needs.detect-targets.outputs.ios == 'true'
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build ios --release --no-codesign --no-pub

      - name: Build macOS release
        if: needs.detect-targets.outputs.macos == 'true'
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build macos --release --no-pub

      - name: Run macOS desktop journey
        if: needs.detect-targets.outputs.macos == 'true'
        timeout-minutes: 15
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          mkdir -p artifacts/apple
          uname -m
          xcodebuild -version
          flutter devices --device-timeout=30
          flutter test integration_test/catalog_journey_test.dart \
            --device-id=macos --no-pub --timeout=10m --reporter=expanded \
            --file-reporter=json:artifacts/apple/macos-journey.json

      - name: Select an installed iOS simulator
        if: needs.detect-targets.outputs.ios == 'true'
        id: ios-simulator
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          inventory = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "--json"], text=True,
          ))
          simulator_sdk = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True,
          ).strip()
          inventory["selected_simulator_sdk"] = simulator_sdk
          inventory["selected_xcode"] = subprocess.check_output(
              ["xcodebuild", "-version"], text=True,
          ).strip()
          Path(os.environ["RUNNER_TEMP"], "beautiful-ios-simulators.json").write_text(
              json.dumps(inventory, indent=2), encoding="utf-8",
          )
          runtimes = [
              runtime for runtime in inventory["runtimes"]
              if runtime.get("isAvailable")
              and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
              and tuple(map(int, runtime["version"].split(".")[:2]))
                  <= tuple(map(int, simulator_sdk.split(".")[:2]))
          ]
          runtimes.sort(
              key=lambda runtime: tuple(int(part) for part in runtime["version"].split(".")),
              reverse=True,
          )
          for runtime in runtimes:
              phones = [
                  device for device in inventory["devices"].get(runtime["identifier"], [])
                  if device.get("isAvailable") and device.get("deviceTypeIdentifier", "").startswith(
                      "com.apple.CoreSimulator.SimDeviceType.iPhone-",
                  )
              ]
              if phones:
                  device = min(phones, key=lambda item: (
                      item["state"] != "Booted", item["name"], item["udid"],
                  ))
                  break
          else:
              raise SystemExit("No available iPhone in an installed iOS runtime; no runtime will be downloaded.")

          print(f"Selected {runtime['name']} with Simulator SDK {simulator_sdk}: {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"device_id={device['udid']}\n")
              output.write(f"shutdown_after={str(device['state'] != 'Booted').lower()}\n")
          PY

      - name: Boot the selected iOS simulator
        if: needs.detect-targets.outputs.ios == 'true'
        id: boot-ios-simulator
        timeout-minutes: 5
        env:
          SIMULATOR_UDID: ${{ steps.ios-simulator.outputs.device_id }}
          SIMULATOR_NEEDS_BOOT: ${{ steps.ios-simulator.outputs.shutdown_after }}
        shell: bash
        run: |
          if [ "$SIMULATOR_NEEDS_BOOT" = 'true' ]; then
            xcrun simctl boot "$SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices --device-timeout=30

      - name: Build iOS simulator journey
        if: needs.detect-targets.outputs.ios == 'true'
        timeout-minutes: 8
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          mkdir -p artifacts/apple
          flutter build ios --debug --simulator --verbose --no-pub \
            --target=integration_test/catalog_journey_test.dart \
            > artifacts/apple/ios-build.log 2>&1

      - name: Run iOS simulator journey
        if: needs.detect-targets.outputs.ios == 'true'
        timeout-minutes: 12
        working-directory: packages/beautiful_ai_ui_catalog
        env:
          SIMULATOR_UDID: ${{ steps.ios-simulator.outputs.device_id }}
        shell: bash
        run: |
          python3 ../../.github/scripts/run_ios_catalog_journey.py \
            --flutter "$(command -v flutter)" --device "$SIMULATOR_UDID" \
            --artifacts artifacts/apple

      - name: Shut down the simulator started by this job
        if: always() && steps.boot-ios-simulator.outcome == 'success' && steps.ios-simulator.outputs.shutdown_after == 'true'
        timeout-minutes: 2
        env:
          SIMULATOR_UDID: ${{ steps.ios-simulator.outputs.device_id }}
        run: xcrun simctl shutdown "$SIMULATOR_UDID"

      - name: Upload Apple journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-journeys
          path: |
            packages/beautiful_ai_ui_catalog/artifacts/apple/
            ${{ runner.temp }}/beautiful-ios-simulators.json
          if-no-files-found: warn
          retention-days: 7

  windows-build:
    name: Build Windows catalog
    needs: detect-targets
    if: needs.detect-targets.outputs.windows == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build windows --release --no-pub

      - name: Run Windows desktop journey
        timeout-minutes: 20
        working-directory: packages/beautiful_ai_ui_catalog
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          Write-Output "Interactive session: $([Environment]::UserInteractive)"
          Get-Process -Id $PID | Select-Object ProcessName, SessionId
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion
          flutter devices --device-timeout=30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test integration_test/catalog_journey_test.dart `
            --device-id=windows --no-pub --timeout=10m --reporter=expanded `
            --file-reporter=json:artifacts/windows/catalog-journey.json

      - name: Upload Windows journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-journey
          path: packages/beautiful_ai_ui_catalog/artifacts/windows/
          if-no-files-found: warn
          retention-days: 7

  linux-build:
    name: Build Linux catalog
    needs: detect-targets
    if: needs.detect-targets.outputs.linux == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libgtk-3-dev liblzma-dev libstdc++-12-dev ninja-build pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter build linux --release --no-pub

  publish-dry-run:
    name: Validate pub.dev package
    needs:
      - detect-targets
      - quality
    if: needs.detect-targets.outputs.library == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui
        run: flutter pub get --enforce-lockfile

      - name: Verify an isolated hosted consumer
        timeout-minutes: 25
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          python3 tool/verify_hosted_consumer.py \
            --flutter "$(command -v flutter)" \
            --timeout 300 \
            --output "$RUNNER_TEMP/hosted-consumer/result.json"

      - name: Run publish dry-run
        working-directory: packages/beautiful_ai_ui
        run: flutter pub publish --dry-run

      - name: Upload isolated consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-hosted-consumer
          path: ${{ runner.temp }}/hosted-consumer/
          if-no-files-found: warn
          retention-days: 7
