name: Edge 152 diagnostic (controlled samples)

on:
  push:
    branches:
      - codex/edge-152-diagnostic

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  LIBRARY_DIR: packages/beautiful_ai_ui
  CATALOG_DIR: packages/beautiful_ai_ui_catalog

jobs:
  edge-journey:
    name: Edge 152 sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the narrow Edge protocol adapter
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_flutter_edge_webdriver.py'

      - name: Install and verify exact official Edge 152 distribution
        working-directory: packages/beautiful_ai_ui_catalog
        run: |
          python3 ../../.github/scripts/install_edge_152_diagnostic.py \
            --install-dir "$RUNNER_TEMP/edge-152-diagnostic" \
            --evidence-dir artifacts/edge/distribution \
            --sample "${{ matrix.sample }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/beautiful_ai_ui_catalog
        run: flutter pub get --enforce-lockfile

      - name: Run shared journey in installed Microsoft Edge
        timeout-minutes: 20
        working-directory: packages/beautiful_ai_ui_catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/edge
          python3 ../../.github/scripts/flutter_edge_webdriver.py \
            --driver "$RUNNER_TEMP/edge-152-diagnostic/msedgedriver" \
            --binary "$(command -v microsoft-edge)" \
            --log artifacts/edge/msedgedriver.log \
            --evidence artifacts/edge/browser-identity.json \
            --diagnostics artifacts/edge/diagnostics \
            > artifacts/edge/adapter.log 2>&1 &
          adapter_pid=$!
          cleanup() {
            if kill -0 "$adapter_pid" 2>/dev/null; then
              kill "$adapter_pid"
              for attempt in {1..60}; do
                if ! kill -0 "$adapter_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.2
              done
              if kill -0 "$adapter_pid" 2>/dev/null; then
                kill -KILL "$adapter_pid"
              fi
              wait "$adapter_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$adapter_pid" 2>/dev/null; then
              cat artifacts/edge/adapter.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:4444/status \
              | jq --exit-status '.value.ready == true' > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo '::error::Microsoft Edge WebDriver did not become ready.'
            exit 1
          fi
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/catalog_journey_test.dart \
            --device-id=web-server --browser-name=edge \
            --driver-port=4444 --browser-dimension=1440x900 \
            --no-pub 2>&1 | tee artifacts/edge/journey.log
          test -s artifacts/edge/browser-identity.json
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          capabilities = json.loads(Path("artifacts/edge/browser-identity.json").read_text())["capabilities"]
          assert capabilities["browserName"] in ("MicrosoftEdge", "msedge")
          assert capabilities["browserVersion"] == "152.0.4191.53", capabilities
          assert capabilities["msedge"]["msedgedriverVersion"].startswith("152.0.4191.53 "), capabilities
          PYVERIFY

      - name: Upload Edge journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-152-sample-${{ matrix.sample }}
          path: packages/beautiful_ai_ui_catalog/artifacts/edge/
          if-no-files-found: warn
          retention-days: 7
