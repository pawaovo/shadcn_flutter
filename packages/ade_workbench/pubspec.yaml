name: ade_workbench
description: "Responsive ADE workspace composed from Beautiful AI UI."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  beautiful_ai_ui: any
  cupertino_icons: 1.0.9
  file_selector: 1.1.0
  web: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
