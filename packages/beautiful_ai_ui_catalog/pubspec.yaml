name: beautiful_ai_ui_catalog
description: "Multi-platform catalog and scripted harness for beautiful_ai_ui."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  beautiful_ai_ui: any
  # Real file selection stays in this host; enable with CATALOG_REAL_FILES.
  crypto: 3.0.7
  file_selector: 1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: false
