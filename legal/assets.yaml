schema_version: 1
updated_at: "2026-09-03"

policy:
  default: deny_unregistered_assets
  rule: Every bundled font, icon font, image, video, audio file, animation, and generated asset needs origin, version or hash, license, destination, and redistribution approval before release.
  remote_media: Runtime loading of source demonstration media is prohibited unless a product-specific security, privacy, reliability, and license review explicitly approves it.
  branding: Source project logos and trade dress are not distributable product branding.

distribution_status_values:
  excluded: Must not be present in source packages, built artifacts, runtime fetches, or release media.
  inherited: Supplied only through an upstream dependency and subject to that dependency's verified license inventory.
  pending_approval: Must not ship until the stated approval gate is complete.
  conditional: May ship only after all listed requirements are complete and the status changes to approved.
  approved: Approved for the recorded files, versions, hashes, destinations, and release scope.

entries:
  - id: central_icons_round_outlined
    source: "@central-icons-react/round-outlined-radius-2-stroke-2"
    source_context: Beautiful UI Sidebar Nav
    kind: commercial_icon_package
    distribution_status: excluded
    distributable: false
    reason: Requires a commercial license key and is unnecessary for parity.
    replacement: Use an approved open icon already available through shadcn_flutter, provisionally Lucide, and preserve the interaction meaning rather than icon identity.

  - id: loading_state_surfer_video
    source: Beautiful UI Loading State Surfer demo video reference
    source_context: Beautiful UI Loading State
    kind: unbundled_unversioned_demo_video
    distribution_status: excluded
    distributable: false
    runtime_fetch_allowed: false
    reason: The pinned registry references /subway-surfers.mp4 while the pinned component source references a remote Vercel Blob; the media binary is absent from the pinned repository and no separate redistribution authorization has been established.
    replacement: Use an original Flutter-rendered animation or an independently licensed project asset recorded here.

  - id: beautiful_ui_and_turbo_brand_assets
    source: Beautiful UI website and repository
    kind: logos_and_brand_assets
    distribution_status: excluded
    distributable: false
    reason: Software licenses do not grant product branding or endorsement rights.
    replacement: Independent project name, iconography, screenshots, and catalog branding.

  - id: shadcn_flutter_bundled_fonts_and_icons
    source: shadcn_flutter package at 5a2376e416fca6c8cc5feb2b5fcf5bf160fa5f73
    kind: dependency_assets
    distribution_status: inherited
    distributable: true
    inventory: legal/dependency_assets.json
    audit_tool: tool/audit_dependency_assets.py
    evidence: docs/beautiful-ui/quality_evidence/2026-09-03-license-audit.md
    approval_gate: The recorded dependency hashes, complete package notices, and actual release bundle inventory must pass for the release candidate.
    notes:
      - Do not duplicate the files into beautiful_ai_ui without a separate asset record.
      - Preserve upstream package license notices and verify Flutter's generated LicenseRegistry against the complete font and icon notices in packages/shadcn_flutter/NOTICES.
      - Current upstream package metadata lists RadixIcons, BootstrapIcons, LucideIcons, GeistSans, and GeistMono assets.
      - The runtime declares 34 Geist font files and three icon fonts; six additional source OTF files are inventoried but not declared into the Catalog runtime.
      - The exact inherited Radix font is pinned by source commit and hash; its original SVG conversion recipe is not reconstructed and is recorded as a provenance limitation.

  - id: country_flags_transitive_media
    source: country_flags 4.1.2 from the official pub.dev archive pinned by pubspec.lock
    source_sha256: f022d18337f3861f1f4e319b936cb53920de9259f38cb09e169eace9942e2b79
    kind: dependency_vector_images
    distribution_status: inherited
    distributable: true
    inventory: legal/transitive_media_assets.json
    audit_tool: tool/audit_transitive_media.py
    evidence: legal/transitive_media_assets.md
    license: MIT
    license_files:
      - LICENSES/COUNTRY_FLAGS_4_1_2_MIT.txt
      - LICENSES/FLAG_ICONS_MIT.txt
    runtime_destination: packages/country_flags/res/si/
    approval_gate: All 266 recorded media hashes and both complete MIT notices must match the actual release bundle, and no unregistered media may be present.
    notes:
      - These assets arrive through the pinned shadcn_flutter dependency graph; they are not copied into the Beautiful AI UI library.
      - All 266 scalable images are byte-for-byte matches to the fixed official package archive and total 2601667 bytes.
      - The package credits lipis/flag-icons without pinning an original SVG revision; this limitation is recorded without claiming that conversion was reproduced.
      - Flutter's generated LicenseRegistry retains the country_flags notice and the flag-icons notice added through packages/shadcn_flutter/NOTICES.

  - id: beautiful_ui_typography_equivalents
    source: Beautiful UI foundation design intent
    kind: fonts
    distribution_status: pending_approval
    distributable: false
    notes:
      - An exact font is not required for architectural parity if platform or approved dependency typography satisfies the role.
      - If Inter, JetBrains Mono, or another font is bundled later, record exact files, upstream version, hashes, license text, subsetting changes, and destination before merge.

