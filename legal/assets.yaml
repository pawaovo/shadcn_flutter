      - legal/catalog_template_assets.sha256 is historical evidence of the replaced template files and is not an active release inventory.

  - id: future_original_assets
    source: project_created_or_commissioned
    kind: generated_or_authored_assets
    distribution_status: conditional
    distributable: false
    requirements:
      - Record creator or generator, creation date, source inputs, usage rights, file hash, and destination.
      - Do not use Beautiful UI, Turbo, or other third-party logos as source material.
      - Review app-store and web privacy implications for any remotely loaded asset.

release_checks:
  - No file ships from an entry whose distributable value is false.
  - Only approved or fully verified inherited entries may contribute files to a release.
  - Package, example, and catalog asset declarations match this inventory.
  - THIRD_PARTY_NOTICES.md and the built Flutter license page cover every redistributed third-party asset.
  - Screenshots and marketing materials are reviewed separately from runtime package contents.
